<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JARVIS AI - Operational Core</title>
  <meta name="theme-color" content="#08090d">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #08090d;
      --card-bg: rgba(15, 20, 31, 0.85);
      --accent-color: #00f3ff;
      --accent-glow: rgba(0, 243, 255, 0.4);
      --text-main: #e0f7fc;
      --text-muted: #64748b;
      --danger: #ff0055;
      --border-color: rgba(0, 243, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: radial-gradient(circle at center, #0f172a 0%, var(--bg-color) 100%);
      border: 1px solid var(--border-color);
    }

    header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background: rgba(8, 9, 13, 0.9);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .sys-badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Orbitron', sans-serif;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-color);
    }

    .view-content {
      flex: 1;
      position: relative;
      overflow-y: auto;
      display: none;
      padding: 15px;
    }

    .view-content.active {
      display: flex;
      flex-direction: column;
    }

    #home-view {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
    }

    .orb-visualizer {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px dashed var(--accent-color);
      box-shadow: 0 0 20px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 12s linear infinite;
      cursor: pointer;
    }

    .orb-inner {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
      opacity: 0.8;
      animation: pulse 2s ease-in-out infinite alternate;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0% { transform: scale(0.85); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 0.9; } }

    .voice-status {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: var(--accent-color);
      letter-spacing: 1px;
      min-height: 24px;
    }

    #chat-view {
      padding: 10px;
      gap: 10px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 5px;
    }

    .message {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid var(--border-color);
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px;
    }

    .input-container {
      padding: 8px 12px;
      background: rgba(8, 9, 13, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .input-container input[type="text"] {
      flex: 1;
      background: rgba(15, 20, 31, 0.9);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 8px 14px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      font-size: 0.9rem;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: rgba(15, 20, 31, 0.9);
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-icon.recording {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .setting-item label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .setting-item input {
      background: rgba(15, 20, 31, 0.9);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.85rem;
    }

    nav {
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      background: rgba(8, 9, 13, 0.95);
      border-top: 1px solid var(--border-color);
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.65rem;
      font-family: 'Orbitron', sans-serif;
    }

    .nav-btn i { font-size: 1.1rem; }

    .nav-btn.active {
      color: var(--accent-color);
      text-shadow: 0 0 8px var(--accent-glow);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="logo"><i class="fa-solid fa-microchip"></i> JARVIS</div>
      <div class="sys-badge">
        <div class="status-dot"></div>
        <span>OPERATIVO</span>
      </div>
    </header>

    <!-- Home View -->
    <main id="home-view" class="view-content active">
      <div class="orb-visualizer" id="orb-trigger">
        <div class="orb-inner"></div>
      </div>
      <div class="voice-status" id="voice-status">Tocca l'orbe o il mic per parlare</div>
      <button class="btn-icon" id="quick-mic-btn" style="width:55px; height:55px; font-size:1.3rem;">
        <i class="fa-solid fa-microphone"></i>
      </button>
    </main>

    <!-- Chat View -->
    <main id="chat-view" class="view-content">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="input-container">
        <input type="text" id="chat-input" placeholder="Chiedi qualcosa a Jarvis..." autocomplete="off">
        <button class="btn-icon" id="mic-btn"><i class="fa-solid fa-microphone"></i></button>
        <button class="btn-icon" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </main>

    <!-- Config View -->
    <main id="settings-view" class="view-content">
      <div class="settings-group">
        <div class="setting-item">
          <label for="api-key">Chiave API Google Gemini</label>
          <input type="password" id="api-key" placeholder="Incolla chiave AIzaSy...">
        </div>
        <button id="save-settings" class="btn-icon" style="width: 100%; border-radius: 8px; font-family:'Orbitron'; font-size: 0.8rem; margin-top: 10px;">SALVA CONFIGURAZIONE</button>
      </div>
    </main>

    <nav>
      <button class="nav-btn active" data-target="home-view">
        <i class="fa-solid fa-atom"></i>
        <span>HUD</span>
      </button>
      <button class="nav-btn" data-target="chat-view">
        <i class="fa-solid fa-message"></i>
        <span>CHAT</span>
      </button>
      <button class="nav-btn" data-target="settings-view">
        <i class="fa-solid fa-sliders"></i>
        <span>CONFIG</span>
      </button>
    </nav>
  </div>

  <script>
    const state = {
      apiKey: localStorage.getItem('jarvis_api_key') || '',
      isListening: false
    };

    // Navigazione Menu
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.target).classList.add('active');
      });
    });

    // Chiamata API Reale a Gemini
    async function fetchGeminiResponse(promptText) {
      if (!state.apiKey) {
        alert("Inserisci la chiave API nelle impostazioni (CONFIG)!");
        document.querySelector('[data-target="settings-view"]').click();
        return "⚠️ Errore: Inserisci la chiave API nella sezione CONFIG per attivare JARVIS.";
      }

      // Utilizza l'endpoint REST nativo
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`;
      
      const payload = {
        contents: [{
          parts: [{ text: "Sei JARVIS, un assistente IA conciso e brillante. Rispondi brevemente in italiano: " + promptText }]
        }]
      };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        
        if (data.error) {
          return `⚠️ Errore Google API: ${data.error.message}`;
        }

        return data.candidates[0].content.parts[0].text;
      } catch (err) {
        return "⚠️ Impossibile connettersi ai server Gemini. Verifica la connessione o l'API Key.";
      }
    }

    // Interfaccia Chat
    const chatMessagesContainer = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerText = text;
      chatMessagesContainer.appendChild(msgDiv);
      chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
      return msgDiv;
    }

    async function handleUserSend(textOverride = null) {
      const text = textOverride || chatInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      chatInput.value = '';

      document.getElementById('voice-status').innerText = 'Elaborazione...';
      const loadingMsg = appendMessage('assistant', 'Pensando...');

      const reply = await fetchGeminiResponse(text);
      loadingMsg.innerText = reply;
      document.getElementById('voice-status').innerText = 'In attesa del comando...';

      speakText(reply);
    }

    document.getElementById('send-btn').addEventListener('click', () => handleUserSend());
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleUserSend(); });

    // Speech Recognition (Riconoscimento Vocale Native)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';

      recognition.onstart = () => {
        state.isListening = true;
        document.getElementById('mic-btn').classList.add('recording');
        document.getElementById('quick-mic-btn').classList.add('recording');
        document.getElementById('voice-status').innerText = 'Ti ascolto...';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        chatInput.value = transcript;
        handleUserSend(transcript);
      };

      recognition.onend = () => {
        state.isListening = false;
        document.getElementById('mic-btn').classList.remove('recording');
        document.getElementById('quick-mic-btn').classList.remove('recording');
      };

      const toggleMic = () => {
        if (!state.isListening) recognition.start();
      };

      document.getElementById('mic-btn').addEventListener('click', toggleMic);
      document.getElementById('quick-mic-btn').addEventListener('click', toggleMic);
      document.getElementById('orb-trigger').addEventListener('click', toggleMic);
    }

    // Speech Synthesis (Sintesi Vocale Native)
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'it-IT';
      window.speechSynthesis.speak(utterance);
    }

    // Configurazione Key
    document.getElementById('save-settings').addEventListener('click', () => {
      state.apiKey = document.getElementById('api-key').value.trim();
      localStorage.setItem('jarvis_api_key', state.apiKey);
      alert('Chiave salvata! Ora JARVIS è pronto ad abbinarsi alle tue richieste.');
      document.querySelector('[data-target="home-view"]').click();
    });

    document.getElementById('api-key').value = state.apiKey;
  </script>
</body>
</html>
