<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JARVIS AI System</title>
  <meta name="theme-color" content="#08090d">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #040810;
      --card-bg: rgba(10, 20, 32, 0.85);
      --accent-color: #00f3ff;
      --accent-glow: rgba(0, 243, 255, 0.4);
      --text-main: #e0f7fc;
      --text-muted: #4a6b82;
      --danger: #ff0055;
      --border-color: rgba(0, 243, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: radial-gradient(circle at center, #0a1626 0%, var(--bg-color) 100%);
      border: 1px solid var(--border-color);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
    }

    /* HEADER HUD */
    header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background: rgba(4, 8, 16, 0.95);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--accent-glow);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-color);
      font-size: 0.75rem;
      background: rgba(0, 243, 255, 0.05);
    }

    .icon-badge.alert {
      border-color: var(--danger);
      color: var(--danger);
    }

    .sys-badge {
      font-size: 0.65rem;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--border-color);
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Orbitron', sans-serif;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-color);
    }

    /* VISTE */
    .view-content {
      flex: 1;
      position: relative;
      overflow-y: auto;
      display: none;
      padding: 15px;
    }

    .view-content.active {
      display: flex;
      flex-direction: column;
    }

    /* CHAT VIEW */
    #chat-view {
      padding: 12px;
      gap: 12px;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 5px;
    }

    /* Scrollbar personalizzata come da screenshot */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
    }

    .message.user {
      align-self: flex-end;
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid var(--border-color);
      border-bottom-right-radius: 2px;
      color: #ffffff;
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(10, 24, 40, 0.9);
      border: 1px solid rgba(0, 243, 255, 0.25);
      border-bottom-left-radius: 2px;
      color: var(--text-main);
    }

    .copy-btn {
      position: absolute;
      bottom: -18px;
      left: 0;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .input-container {
      padding: 10px;
      background: rgba(4, 8, 16, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 25px;
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 5px;
    }

    .input-container input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      padding: 6px 10px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      font-size: 0.95rem;
    }

    .input-container input::placeholder {
      color: var(--text-muted);
    }

    .btn-action {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: rgba(0, 243, 255, 0.05);
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-action:active {
      transform: scale(0.95);
      background: rgba(0, 243, 255, 0.2);
    }

    .btn-action.recording {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
      box-shadow: 0 0 10px var(--danger);
    }

    /* HUD & UTILITY VIEWS */
    #hud-view, #utility-view {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hud-orb {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 2px dashed var(--accent-color);
      box-shadow: 0 0 25px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 15s linear infinite;
      margin-bottom: 20px;
    }

    .hud-orb-inner {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
      opacity: 0.8;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* CONFIG VIEW */
    .config-box {
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .config-box label {
      font-size: 0.85rem;
      color: var(--accent-color);
      font-family: 'Orbitron', sans-serif;
    }

    .config-box input {
      background: rgba(4, 8, 16, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      color: var(--text-main);
      outline: none;
    }

    .save-btn {
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 10px;
      border-radius: 6px;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
    }

    /* BARRA DI NAVIGAZIONE IN BASSO */
    nav {
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      background: rgba(4, 8, 16, 0.98);
      border-top: 1px solid var(--border-color);
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-family: 'Orbitron', sans-serif;
      transition: color 0.2s ease;
    }

    .nav-btn i { font-size: 1.2rem; }

    .nav-btn.active {
      color: var(--accent-color);
      text-shadow: 0 0 8px var(--accent-glow);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="logo">
        <i class="fa-solid fa-microchip"></i> JARVIS
      </div>
      <div class="header-actions">
        <div class="icon-badge alert"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div class="icon-badge"><i class="fa-solid fa-cloud-sun"></i></div>
        <div class="sys-badge">
          <div class="status-dot"></div>
          <span>ONLINE</span>
        </div>
      </div>
    </header>

    <!-- HUD View -->
    <main id="hud-view" class="view-content">
      <div class="hud-orb">
        <div class="hud-orb-inner"></div>
      </div>
      <h3 style="font-family:'Orbitron'; color:var(--accent-color);">SISTEMA PRONTO</h3>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-top:5px;">Spostati nel tab CHAT per interagire con Jarvis.</p>
    </main>

    <!-- Chat View (Attivo di default) -->
    <main id="chat-view" class="view-content active">
      <div class="chat-messages" id="chat-messages">
        <!-- Messaggio iniziale -->
        <div class="message assistant">
          Sistemi online. Come posso assisterti, Signore?
        </div>
      </div>

      <!-- Barra Input come nello Screenshot -->
      <div class="input-container">
        <button class="btn-action" id="attach-btn"><i class="fa-solid fa-paperclip"></i></button>
        <input type="text" id="chat-input" placeholder="Comando o domanda per Jarvis..." autocomplete="off">
        <button class="btn-action" id="mic-btn"><i class="fa-solid fa-microphone"></i></button>
        <button class="btn-action" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </main>

    <!-- Utility View -->
    <main id="utility-view" class="view-content">
      <h3 style="font-family:'Orbitron'; color:var(--accent-color); margin-bottom:10px;">UTILITY MODES</h3>
      <p style="color:var(--text-muted);">Strumenti diagnostici e moduli aggiuntivi attivi.</p>
    </main>

    <!-- Config View -->
    <main id="settings-view" class="view-content">
      <div class="config-box">
        <label for="api-key">CHIAVE API GOOGLE GEMINI</label>
        <input type="password" id="api-key" placeholder="Incolla chiave AIzaSy...">
        <button class="save-btn" id="save-settings">SALVA CONFIGURAZIONE</button>
      </div>
    </main>

    <!-- Navigazione In Basso -->
    <nav>
      <button class="nav-btn" data-target="hud-view">
        <i class="fa-solid fa-gear"></i>
        <span>HUD</span>
      </button>
      <button class="nav-btn active" data-target="chat-view">
        <i class="fa-solid fa-comment-dots"></i>
        <span>CHAT</span>
      </button>
      <button class="nav-btn" data-target="utility-view">
        <i class="fa-solid fa-cubes"></i>
        <span>UTILITY</span>
      </button>
      <button class="nav-btn" data-target="settings-view">
        <i class="fa-solid fa-sliders"></i>
        <span>CONFIG</span>
      </button>
    </nav>
  </div>

  <script>
    const state = {
      apiKey: localStorage.getItem('jarvis_api_key') || '',
      isListening: false
    };

    // Navigazione Tab
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.target).classList.add('active');
      });
    });

    // Chiamata Gemini diretta ed esente da blocchi
    async function fetchGeminiResponse(promptText) {
      if (!state.apiKey) {
        return "⚠️ Inserisci la tua API Key nella sezione CONFIG prima di continuare.";
      }

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${state.apiKey}`;

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "Sei JARVIS, un assistente virtuale evoluto, conciso e formale. Rispondi in italiano: " + promptText }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          return `⚠️ Errore Google API: ${data.error.message}`;
        }

        return data.candidates[0].content.parts[0].text;
      } catch (err) {
        return "⚠️ Errore di connessione ai server di Google Gemini.";
      }
    }

    // Gestione Chat
    const chatMessagesContainer = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerText = text;
      
      if (sender === 'assistant') {
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>';
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(text);
          copyBtn.innerHTML = '<i class="fa-solid fa-check"></i>';
          setTimeout(() => copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>', 1500);
        };
        msgDiv.appendChild(copyBtn);
      }

      chatMessagesContainer.appendChild(msgDiv);
      chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
      return msgDiv;
    }

    async function handleUserSend(textOverride = null) {
      const text = textOverride || chatInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      chatInput.value = '';

      // Mostra inizialmente i tre pallini "..."
      const loadingMsg = appendMessage('assistant', '...');

      // Sostituisce i tre pallini con la risposta reale
      const reply = await fetchGeminiResponse(text);
      loadingMsg.childNodes[0].nodeValue = reply;

      speakText(reply);
    }

    document.getElementById('send-btn').addEventListener('click', () => handleUserSend());
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleUserSend(); });

    // Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';

      recognition.onstart = () => {
        state.isListening = true;
        document.getElementById('mic-btn').classList.add('recording');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        chatInput.value = transcript;
        handleUserSend(transcript);
      };

      recognition.onend = () => {
        state.isListening = false;
        document.getElementById('mic-btn').classList.remove('recording');
      };

      document.getElementById('mic-btn').addEventListener('click', () => {
        if (!state.isListening) recognition.start();
      });
    }

    // Speech Synthesis
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text.replace(/⚠️/g, ''));
      utterance.lang = 'it-IT';
      window.speechSynthesis.speak(utterance);
    }

    // Configurazione Key
    document.getElementById('save-settings').addEventListener('click', () => {
      state.apiKey = document.getElementById('api-key').value.trim();
      localStorage.setItem('jarvis_api_key', state.apiKey);
      alert('Chiave salvata correttamente!');
      document.querySelector('[data-target="chat-view"]').click();
    });

    document.getElementById('api-key').value = state.apiKey;
  </script>
</body>
</html>
